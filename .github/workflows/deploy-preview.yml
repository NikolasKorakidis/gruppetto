# Publishes the web app in demo mode to GitHub Pages on every push to main.
# Preview: https://<owner>.github.io/<repo>/
name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test:gpx
          npm run test:db
      - name: Build web demo
        env:
          EXPO_PUBLIC_DEMO: '1'
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: |
          npx expo export --platform web
          # GitHub Pages has no SPA rewrites: serve the app for every unknown path.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
