# Local development config for the Supabase CLI (`npx supabase start`).
# For the hosted project, mirror the [auth] settings in the dashboard (see README).
project_id = "gruppetto"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Local email catcher: open http://localhost:54324 to read confirmation emails.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "gruppetto://**",
  "exp://**",
  "http://localhost:8081/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your Gruppetto account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Gruppetto password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[edge_runtime]
enabled = true
policy = "per_worker"

# These functions authenticate requests themselves (webhook secret, calendar
# token, or by validating the user's JWT in code).
[functions.send-push]
verify_jwt = false

[functions.calendar]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
